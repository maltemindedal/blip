name: CI

permissions:
  contents: read

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# A new push to the same ref supersedes any run still in flight.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          # Single source of truth for the toolchain version.
          go-version-file: go.mod
          cache: true

      - name: Verify module graph
        run: go mod verify

      - name: Verify go.mod and go.sum are tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: Build
        run: go build ./...

      - name: Test
        run: go test -race -shuffle=on -coverprofile=coverage.out -covermode=atomic ./...

      - name: Upload coverage
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage.out
          flags: unittests
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  bench:
    name: Benchmarks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # Smoke test only: confirms the benchmarks still compile and run. The
      # numbers are not compared across runs, since GitHub runners are too
      # noisy for that to mean anything.
      - name: Run benchmarks
        run: go test -run '^$' -bench . -benchtime=10x ./internal/...

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
          args: --timeout=10m

  vulncheck:
    name: Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # Pinned like every other tool in this workflow, so a govulncheck release
      # cannot change the result of a rerun of an old commit.
      - name: Run govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...

  docker:
    name: Docker Build and Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7

      - name: Build image
        run: docker build -t blip:${{ github.sha }} .

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: blip:${{ github.sha }}
          format: sarif
          output: trivy-results.sarif
          ignore-unfixed: true

      # Forks cannot write security events, so only upload from branches in this
      # repository. PRs from forks still build and scan; they just skip the
      # upload instead of failing it.
      - name: Upload Trivy results
        uses: github/codeql-action/upload-sarif@v4
        if: always() && github.event.pull_request.head.repo.fork != true
        with:
          sarif_file: trivy-results.sarif
