# golangci-lint configuration
# Docs: https://golangci-lint.run/docs/configuration/file/
version: "2"

run:
  timeout: 5m

linters:
  enable:
    # Correctness
    - errcheck # Unchecked errors
    - govet # Suspicious constructs
    - staticcheck # Comprehensive static analysis
    - unused # Unused constants, functions, types, and variables
    - ineffassign # Ineffectual assignments
    - bodyclose # Unclosed HTTP response bodies
    - errorlint # Error wrapping and comparison mistakes
    - errname # Error variable and type naming
    - wastedassign # Assignments whose value is never used
    - nilerr # Returning nil when an error is non-nil

    # Security
    - gosec

    # Style and modernization
    - revive # Fast, configurable style checks
    - misspell
    - unconvert # Unnecessary type conversions
    - copyloopvar # Pre-1.22 loop variable copies
    - intrange # `for i := range n` over three-clause loops
    - usestdlibvars # Standard library constants over string literals
    - perfsprint # Faster alternatives to fmt.Sprintf
    - sloglint # Consistent log/slog usage
    - nolintlint # Well-formed, justified nolint directives

    # Tests
    - thelper # t.Helper() in test helpers
    - usetesting # Prefer t.Context, t.Chdir, t.Setenv over manual equivalents

  settings:
    govet:
      # On top of the default analyzers: nil dereferences, shadowed variables
      # (an inner `err :=` hiding the outer one), struct writes that are dropped,
      # and malformed sort.Slice arguments.
      enable:
        - nilness
        - shadow
        - unusedwrite
        - sortslice
    sloglint:
      # Attributes must be key-value pairs; keys are static snake_case strings.
      kv-only: true
      key-naming-case: snake
      static-msg: false
    nolintlint:
      require-explanation: true
      require-specific: true

formatters:
  enable:
    - gofmt
    - goimports
